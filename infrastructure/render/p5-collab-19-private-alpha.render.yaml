services:
  - type: web
    name: tutorhub-p5-p519-control-bs-20260825
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: off
    buildCommand: node --version
    startCommand: node scripts/p519-live-control.mjs
    healthCheckPath: /livez
    envVars:
      - key: P5_COLLAB_19_DISPOSABLE_CONFIRM
        value: I_UNDERSTAND_P5_COLLAB_19_DISPOSABLE_ONLY
      - key: P5_COLLAB_19_ALLOWED_ORIGIN
        value: https://p519-private-alpha.invalid
      - key: P5_COLLAB_19_PROVIDER_DOCUMENT_NAMES
        value: wb_p519_private_alpha_document_01,wb_p519_private_alpha_document_02
      - key: P5_COLLAB_19_CONTROL_TOKEN_CURRENT
        sync: false
      - key: P5_COLLAB_19_CONTROL_ADMIN_TOKEN
        sync: false

  - type: web
    name: tutorhub-p5-p519-runtime-bs-20260825
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: off
    dockerfilePath: ./services/whiteboard-runtime/Dockerfile
    dockerContext: .
    healthCheckPath: /livez
    envVars:
      - key: COLLAB_RUNTIME_PROFILE
        value: FREE_PRIVATE_ALPHA
      - key: COLLAB_INSTANCE_COUNT
        value: "1"
      - key: COLLAB_ALLOWED_ORIGINS
        value: https://p519-private-alpha.invalid
      - key: COLLAB_CONTROL_PLANE_URL
        value: https://tutorhub-p5-p519-control-bs-20260825.onrender.com
      - key: COLLAB_CONTROL_PLANE_TOKEN
        sync: false
      - key: COLLAB_METRICS_TOKEN
        sync: false
      - key: COLLAB_BUILD_ID
        sync: false
      - key: COLLAB_DRAIN_TIMEOUT_MS
        value: "25000"
      - key: COLLAB_PROBE_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_COLLABORATION_URL
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
