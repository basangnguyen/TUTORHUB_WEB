name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tutorhub_test
          POSTGRES_USER: tutorhub
          POSTGRES_PASSWORD: tutorhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutorhub -d tutorhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_POOL_URL: postgresql://tutorhub:tutorhub_ci@localhost:5432/tutorhub_test?sslmode=disable
      DATABASE_MIGRATION_URL: postgresql://tutorhub:tutorhub_ci@localhost:5432/tutorhub_test?sslmode=disable
      DATABASE_CONVERSATION_ACL_TEST_URL: postgresql://tutorhub_conversation_runtime_ci:tutorhub_ci@localhost:5432/tutorhub_test?sslmode=disable
      DATABASE_MEDIA_FIXTURE_TEST_URL: postgresql://tutorhub_media_fixture_ci:tutorhub_ci@localhost:5432/tutorhub_test?sslmode=disable
      DATABASE_POLL_MAINTENANCE_URL: postgresql://tutorhub_media_maintenance_ci:tutorhub_ci@localhost:5432/tutorhub_test?sslmode=disable
      CONVERSATION_ACL_TEST_BOOTSTRAP: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache-dependency-path: services/core-api/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check workflow security policy
        run: pnpm security:actions

      - name: PostgreSQL migration integration
        run: go test -count=1 -tags=integration ./services/core-api/internal/platform/migrationrunner

      - name: P3-03 outbox worker integration
        run: go test -count=1 -tags=integration ./services/core-api/internal/platform/outboxworker

      - name: P2-11 fixture import integration
        run: go test -count=1 -tags=integration ./services/core-api/internal/platform/v1import

      - name: PostgreSQL module integration
        run: |
          go test -count=1 -tags=integration ./services/core-api/internal/modules/classroom
          go test -count=1 -tags=integration ./services/core-api/internal/modules/identity
          go test -count=1 -tags=integration ./services/core-api/internal/modules/audit
          go test -count=1 -tags=integration ./services/core-api/internal/modules/featurecontrol
          go test -count=1 -tags=integration ./services/core-api/internal/modules/conversation
          go test -count=1 -tags=integration ./services/core-api/internal/modules/content

      - name: PostgreSQL media integration
        env:
          DATABASE_POOL_URL: ${{ env.DATABASE_CONVERSATION_ACL_TEST_URL }}
          P4_02_DISPOSABLE_CONFIRM: I_UNDERSTAND_P4_02_DISPOSABLE_ONLY
          P4_04_DISPOSABLE_CONFIRM: I_UNDERSTAND_P4_04_DISPOSABLE_ONLY
          P4_04_ACL_PROVISION_CONFIRM: I_UNDERSTAND_P4_04_ACL_PROVISION_DISPOSABLE_ONLY
          P4_06_DISPOSABLE_CONFIRM: I_UNDERSTAND_P4_06_DISPOSABLE_ONLY
          P4_06_ACL_PROVISION_CONFIRM: I_UNDERSTAND_P4_06_ACL_PROVISION_DISPOSABLE_ONLY
          P4_07_DISPOSABLE_CONFIRM: I_UNDERSTAND_P4_07_DISPOSABLE_ONLY
          P4_07_ACL_PROVISION_CONFIRM: I_UNDERSTAND_P4_07_ACL_PROVISION_DISPOSABLE_ONLY
        run: |
          node scripts/require-media-disposable-confirm.mjs
          psql "$DATABASE_MIGRATION_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          DO $bootstrap$
          BEGIN
              IF NOT EXISTS (
                  SELECT 1 FROM pg_roles WHERE rolname = 'tutorhub_media_maintenance_ci'
              ) THEN
                  CREATE ROLE tutorhub_media_maintenance_ci
                      LOGIN PASSWORD 'tutorhub_ci'
                      NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
                      NOREPLICATION NOBYPASSRLS;
              END IF;
          END
          $bootstrap$;
          ALTER ROLE tutorhub_media_maintenance_ci
              WITH LOGIN PASSWORD 'tutorhub_ci'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
              NOREPLICATION NOBYPASSRLS;
          SQL
          go test -count=1 -tags=integration \
            -run '^TestPostgresMediaModerationForwardMigration$' \
            ./services/core-api/internal/modules/media
          go test -count=1 -tags=integration \
            -run '^TestProvisionPostgresMediaModerationExactACL$' \
            ./services/core-api/internal/modules/media
          go test -count=1 -tags=integration \
            -run '^TestPostgresMediaLifecycleRuntimeExactACL$' \
            ./services/core-api/internal/modules/media
          # Cross-module fixtures use a distinct, non-superuser role in this
          # disposable CI database. The exact media role remains narrow above;
          # Neon disposable acceptance covers the real Core API runtime role.
          psql "$DATABASE_MIGRATION_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          DO $bootstrap$
          BEGIN
              IF NOT EXISTS (
                  SELECT 1 FROM pg_roles WHERE rolname = 'tutorhub_media_fixture_ci'
              ) THEN
                  CREATE ROLE tutorhub_media_fixture_ci
                      LOGIN PASSWORD 'tutorhub_ci'
                      NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
                      NOREPLICATION NOBYPASSRLS;
              END IF;
          END
          $bootstrap$;
          ALTER ROLE tutorhub_media_fixture_ci
              WITH LOGIN PASSWORD 'tutorhub_ci'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
              NOREPLICATION NOBYPASSRLS;
          GRANT USAGE ON SCHEMA tutorhub TO tutorhub_media_fixture_ci;
          REVOKE CREATE ON SCHEMA tutorhub FROM tutorhub_media_fixture_ci;
          GRANT SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA tutorhub
              TO tutorhub_media_fixture_ci;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA tutorhub
              TO tutorhub_media_fixture_ci;
          SQL
          DATABASE_POOL_URL="$DATABASE_MEDIA_FIXTURE_TEST_URL" go test -count=1 -tags=integration \
            -run '^TestPostgresMediaModerationAuthorityConcurrencyAndProviderReceipts$' \
            ./services/core-api/internal/modules/media
          DATABASE_POOL_URL="$DATABASE_MEDIA_FIXTURE_TEST_URL" go test -count=1 -tags=integration \
            -run '^TestPostgresMediaLobbyAdmissionInviteRaceAndRestoreBarrier$' \
            ./services/core-api/internal/modules/media
          DATABASE_POOL_URL="$DATABASE_MEDIA_FIXTURE_TEST_URL" go test -count=1 -tags=integration \
            -run '^TestPostgresMediaLifecycleAuthorityConcurrencyQuotaAndPrivacy$' \
            ./services/core-api/internal/modules/media
          DATABASE_POOL_URL="$DATABASE_MEDIA_FIXTURE_TEST_URL" go test -count=1 -tags=integration \
            -run '^TestPostgresMediaRoomInstanceCredentialAndSignedWebhookBinding$' \
            ./services/core-api/internal/modules/media
          go test -count=1 -tags=integration \
            -run '^TestPostgresMediaSignalMaintenanceACLRetentionAndSkipLocked$' \
            ./services/core-api/internal/modules/media
          DATABASE_POOL_URL="$DATABASE_MEDIA_FIXTURE_TEST_URL" go test -count=1 -tags=integration \
            -run '^TestPostgresMediaParticipantSignalsLifecycleAndConcurrency$' \
            ./services/core-api/internal/modules/media

      - name: PostgreSQL security integration
        run: pnpm test:security:integration

      - name: Verify repository
        run: pnpm verify

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tutorhub_e2e
          POSTGRES_USER: tutorhub
          POSTGRES_PASSWORD: tutorhub_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutorhub -d tutorhub_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      E2E_DATABASE_MODE: external
      E2E_DATABASE_URL: postgresql://tutorhub:tutorhub_local@127.0.0.1:5432/tutorhub_e2e?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache-dependency-path: services/core-api/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E
        run: |
          pnpm e2e
          pnpm e2e:media-fixture

  local-environment-smoke:
    name: Local environment smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache-dependency-path: services/core-api/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start, migrate, and seed local services twice
        run: |
          pnpm local:setup
          pnpm local:setup

      - name: Verify deterministic fixtures
        run: |
          test "$(docker compose exec -T postgres psql -U tutorhub -d tutorhub -Atc "SELECT count(*) FROM tutorhub.tenants WHERE slug = 'tutorhub-demo';")" = "1"
          test "$(docker compose exec -T postgres psql -U tutorhub -d tutorhub -Atc "SELECT count(*) FROM tutorhub.users WHERE email LIKE '%@tutorhub.local';")" = "2"
          test "$(docker compose exec -T postgres psql -U tutorhub -d tutorhub -Atc "SELECT count(*) FROM tutorhub.classes WHERE code = 'DEMO-VI-01';")" = "1"
          test "$(docker compose exec -T redis redis-cli ping)" = "PONG"

      - name: Stop local services
        if: always()
        run: docker compose down --volumes --remove-orphans
