name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Reject newly introduced high-severity dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          show-patched-versions: true

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.6
          cache-dependency-path: services/core-api/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build Go for analysis
        if: matrix.language == 'go'
        working-directory: services/core-api
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@24ea975727876cf496b1eb0c5b36e96e01600b51 # v4.37.0
        with:
          category: /language:${{ matrix.language }}

  repository-scan:
    name: Repository vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Scan dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-repository.sarif
          exit-code: 0

      - name: Enforce repository vulnerability threshold
        run: node scripts/check-trivy-sarif.mjs trivy-repository.sarif repository

      - name: Upload repository findings
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@24ea975727876cf496b1eb0c5b36e96e01600b51 # v4.37.0
        with:
          sarif_file: trivy-repository.sarif
          category: trivy-repository

  container-scan:
    name: Core API container scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Build the Core API image
        run: docker build --tag tutorhub-core-api:security-scan --file infrastructure/huggingface/core-api/Dockerfile .

      - name: Scan the Core API image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: tutorhub-core-api:security-scan
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-container.sarif
          exit-code: 0

      - name: Enforce container vulnerability threshold
        run: node scripts/check-trivy-sarif.mjs trivy-container.sarif container

      - name: Upload container findings
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@24ea975727876cf496b1eb0c5b36e96e01600b51 # v4.37.0
        with:
          sarif_file: trivy-container.sarif
          category: trivy-container

  whiteboard-runtime-container-scan:
    name: Whiteboard runtime OCI, SBOM and vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Check immutable OCI contract
        run: node scripts/check-whiteboard-runtime-oci.mjs

      - name: Build exact whiteboard runtime image
        run: >-
          docker build
          --tag tutorhub-whiteboard-runtime:security-scan
          --file services/whiteboard-runtime/Dockerfile
          .

      - name: Inspect non-root runtime image
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' tutorhub-whiteboard-runtime:security-scan)" = "node"
          test "$(docker image inspect --format '{{json .Config.Cmd}}' tutorhub-whiteboard-runtime:security-scan)" = '["node","dist/main.js"]'
          docker run --rm --entrypoint node tutorhub-whiteboard-runtime:security-scan -e "const fs=require('node:fs'); for (const path of ['/usr/local/bin/npm','/usr/local/bin/npx','/usr/local/bin/corepack','/usr/local/bin/pnpm']) { if (fs.existsSync(path)) process.exit(1) }"

      - name: Record exact OCI image ID
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' tutorhub-whiteboard-runtime:security-scan)"
          printf '%s\n' "${image_id}" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '%s\n' "${image_id}" > tutorhub-whiteboard-runtime.image-id.txt

      - name: Scan whiteboard runtime image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: tutorhub-whiteboard-runtime:security-scan
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-whiteboard-runtime.sarif
          exit-code: 0

      - name: Enforce whiteboard runtime vulnerability threshold
        run: node scripts/check-trivy-sarif.mjs trivy-whiteboard-runtime.sarif whiteboard-runtime

      - name: Generate CycloneDX SBOM
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: tutorhub-whiteboard-runtime:security-scan
          scanners: vuln
          format: cyclonedx
          output: tutorhub-whiteboard-runtime.cdx.json
          exit-code: 0

      - name: Validate secret-safe SBOM
        if: always()
        run: node scripts/check-whiteboard-runtime-sbom.mjs tutorhub-whiteboard-runtime.cdx.json

      - name: Upload whiteboard runtime findings
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@24ea975727876cf496b1eb0c5b36e96e01600b51 # v4.37.0
        with:
          sarif_file: trivy-whiteboard-runtime.sarif
          category: trivy-whiteboard-runtime

      - name: Retain whiteboard runtime SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: whiteboard-runtime-sbom
          path: |
            tutorhub-whiteboard-runtime.cdx.json
            tutorhub-whiteboard-runtime.image-id.txt
          if-no-files-found: error
          retention-days: 14
