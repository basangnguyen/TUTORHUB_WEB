          description: Internal TutorHub user identifier; never a delivery address.
        participation_role:
          $ref: "#/components/schemas/SessionParticipationRole"
        business_role:
          $ref: "#/components/schemas/SessionParticipationBusinessRole"
        rsvp_state:
          $ref: "#/components/schemas/SessionRSVPState"
        responded_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        version:
          type: integer
          format: int64
          minimum: 1
        is_self:
          type: boolean
      description: |
        Privacy-filtered internal attendee projection. It deliberately contains
        no email, display name, delivery address, ciphertext or fingerprint.
    SessionAudience:
      type: object
      additionalProperties: false
      required:
        [
          audience_revision,
          response_requested,
          attendees,
          external_attendees,
          viewer_access,
        ]
      properties:
        audience_revision:
          type: integer
          format: int64
          minimum: 0
        response_requested:
          type: boolean
        attendees:
          type: array
          maxItems: 128
          items:
            $ref: "#/components/schemas/SessionAudienceAttendee"
        external_attendees:
          type: array
          maxItems: 128
          description: |
            Manager-only external-recipient projection. It is always empty for
            ordinary participants, regardless of guest-list visibility, so a
            delivery address is never disclosed to another attendee.
          items:
            $ref: "#/components/schemas/SessionAudienceExternalAttendee"
        viewer_access:
          $ref: "#/components/schemas/SessionAudienceViewerAccess"
