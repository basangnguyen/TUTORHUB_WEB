          class_session: "#/components/schemas/ClassSessionMediaSpaceSource"
          class_session_occurrence: "#/components/schemas/ClassSessionOccurrenceMediaSpaceSource"
          study_meeting: "#/components/schemas/StudyMeetingMediaSpaceSource"
