components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: tutorhub_session
      description: Opaque TutorHub BFF session cookie; secure deployments use the __Host- prefix.
  responses:
    ProblemResponse:
      description: Request failed with a structured problem response
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnauthorizedResponse:
      description: Authentication is missing, expired, or invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ForbiddenResponse:
      description: The authenticated actor lacks permission in the active workspace
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFoundResponse:
      description: The resource is absent or outside the active tenant/class scope
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConflictResponse:
      description: The request conflicts with the current resource state or version
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    OrganizationRole:
      type: string
      enum: [org_admin, teacher, student, guest]
    ClassRole:
      type: string
      enum: [owner, co_teacher, teaching_assistant, student]
    ClassEnrollmentRole:
      type: string
      description: Persisted enrollment roles; class owner remains implicit in classes.owner_user_id.
      enum: [co_teacher, teaching_assistant, student]
    Permission:
      type: string
      enum:
        - tenant.view
        - tenant.manage
        - tenant.manage_members
        - tenant.manage_features
        - class.create
        - class.update
        - class.archive
        - class.transfer_ownership
        - class.view
        - enrollment.manage
        - enrollment.leave
        - session.schedule
        - session.start
        - session.end
        - session.join
        - participant.admit
        - participant.remove
        - media.publish
        - chat.send
        - audit.view
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, environment, timestamp]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
        environment:
          type: string
        timestamp:
          type: string
          format: date-time
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status, timestamp]
      properties:
        status:
          type: string
          const: live
        timestamp:
          type: string
          format: date-time
    ReadinessCheck:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ready, not_ready]
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, checks, timestamp]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessCheck"
        timestamp:
          type: string
          format: date-time
    APIStatusResponse:
      type: object
      additionalProperties: false
      required: [status, service, version, environment, timestamp]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
        version:
          type: string
        environment:
          type: string
        timestamp:
          type: string
          format: date-time
    CSRFResponse:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
    LogoutResponse:
      type: object
      additionalProperties: false
      properties:
        logout_url:
          type: string
          format: uri
