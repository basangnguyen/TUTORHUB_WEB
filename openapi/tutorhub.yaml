      oneOf:
        - type: object
          additionalProperties: false
          required: [type, count]
          properties:
            type:
              type: string
              const: after_count
            count:
              type: integer
              minimum: 1
              maximum: 512
        - type: object
          additionalProperties: false
          required: [type, date]
          properties:
            type:
              type: string
              const: on_date
            date:
              type: string
              format: date
      description: Exactly one bounded recurrence terminator is required.
    ClassSessionRecurrenceRule:
      type: object
      additionalProperties: false
      required: [frequency, interval, ends]
      properties:
        frequency:
          $ref: "#/components/schemas/ClassSessionRecurrenceFrequency"
        interval:
          type: integer
          minimum: 1
          maximum: 366
        weekdays:
          type: array
          uniqueItems: true
          maxItems: 7
          items:
            $ref: "#/components/schemas/ClassSessionRecurrenceWeekday"
        month_days:
          type: array
          uniqueItems: true
          maxItems: 31
          items:
            type: integer
            minimum: -31
            maximum: 31
            not:
              const: 0
        months:
          type: array
          uniqueItems: true
          maxItems: 12
          items:
            type: integer
            minimum: 1
            maximum: 12
        ends:
          $ref: "#/components/schemas/ClassSessionRecurrenceEnd"
      description: |
        Typed RFC 5545 subset. Raw RRULE strings, unbounded rules and
        secondly/minutely/hourly frequencies are not accepted at the API boundary.
