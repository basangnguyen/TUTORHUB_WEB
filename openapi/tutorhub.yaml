          $ref: "#/components/schemas/WhiteboardCapability"
        can_open:
          type: boolean
        can_suspend:
          type: boolean
        can_resume:
          type: boolean
        can_close:
          type: boolean
        can_create_snapshot:
          type: boolean
        can_export:
          type: boolean
        can_restore:
          type: boolean
        can_exchange_grant:
          type: boolean
    WhiteboardDocument:
      type: object
      additionalProperties: false
      description: Authorization-filtered control-plane projection. Provider names and storage coordinates are intentionally absent.
      required:
        - id
        - media_space_id
        - status
        - version
        - current_generation
        - revoke_generation
        - viewer_capabilities
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        media_space_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/WhiteboardStatus"
        version:
          type: integer
          format: int64
          minimum: 1
        current_generation:
          type: integer
          format: int64
          minimum: 1
        revoke_generation:
          type: integer
          format: int64
          minimum: 1
        viewer_capabilities:
          $ref: "#/components/schemas/WhiteboardViewerCapabilities"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WhiteboardToolProjection:
      type: object
      additionalProperties: false
      description: Server-authoritative classroom tool discovery. A null document is an explicit empty state, while can_create is projected only after current media-space authorization.
      required: [document, can_create]
      properties:
        document:
          oneOf:
            - $ref: "#/components/schemas/WhiteboardDocument"
            - type: "null"
        can_create:
          type: boolean
    CreateWhiteboardRequest:
      type: object
      additionalProperties: false
      required: [media_space_id, idempotency_key]
      properties:
        media_space_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 16
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$"
    WhiteboardTransitionRequest:
      type: object
      additionalProperties: false
      required: [expected_version, idempotency_key]
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
        idempotency_key:
          type: string
          minLength: 16
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$"
    WhiteboardGrantExchangeRequest:
      type: object
      additionalProperties: false
      required: [capability, expected_generation, expected_revoke_generation]
      properties:
        capability:
          $ref: "#/components/schemas/WhiteboardCapability"
        expected_generation:
          type: integer
          format: int64
          minimum: 1
        expected_revoke_generation:
          type: integer
          format: int64
          minimum: 1
    WhiteboardGrantCredential:
      type: object
      additionalProperties: false
      description: Short-lived sensitive credential projection. It must not be cached, logged, or placed in a URL.
      required:
        - credential
        - provider_url
        - document_id
        - generation
        - revoke_generation
        - capability
        - expires_at
      properties:
        credential:
          type: string
          minLength: 1
          maxLength: 8192
          description: Opaque one-time or short-lived provider credential.
        provider_url:
          type: string
          format: uri
          maxLength: 2048
        document_id:
          type: string
          format: uuid
        generation:
          type: integer
          format: int64
          minimum: 1
        revoke_generation:
          type: integer
          format: int64
          minimum: 1
        capability:
          $ref: "#/components/schemas/WhiteboardCapability"
        expires_at:
          type: string
          format: date-time
    WhiteboardSnapshot:
      type: object
      additionalProperties: false
      description: Immutable portable snapshot metadata. B2 bucket, object key, version, and credential data are never returned.
      required:
        - id
        - document_id
        - generation
        - kind
        - format_version
        - engine_version
        - authority_version
        - schema_version
        - causal_watermark_sha256
        - content_sha256
        - size_bytes
        - created_at
        - retention_until
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        generation:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          enum: [automatic, manual, export, pre_restore]
        format_version:
          type: string
          minLength: 1
          maxLength: 32
        engine_version:
          type: string
          minLength: 1
          maxLength: 64
        authority_version:
          type: string
          minLength: 1
          maxLength: 64
        schema_version:
          type: integer
          minimum: 1
          maximum: 1000
        causal_watermark_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        content_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 67108864
        created_at:
          type: string
          format: date-time
        retention_until:
          type: string
          format: date-time
    WhiteboardSnapshotList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/WhiteboardSnapshot"
    WhiteboardArtifactRequest:
      type: object
      additionalProperties: false
      required: [expected_generation, idempotency_key]
      properties:
        expected_generation:
          type: integer
          format: int64
          minimum: 1
        idempotency_key:
          type: string
          minLength: 16
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$"
    WhiteboardArtifactCommand:
      type: object
      additionalProperties: false
      required: [id, kind, document_id, generation, status, requested_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [snapshot, export]
        document_id:
          type: string
          format: uuid
        generation:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          const: accepted
        requested_at:
          type: string
          format: date-time
    WhiteboardImportManifest:
      type: object
      additionalProperties: false
      required:
        - format_version
        - engine_version
        - authority_version
        - schema_version
        - content_sha256
        - size_bytes
      properties:
        format_version:
          type: string
          minLength: 1
          maxLength: 32
        engine_version:
          type: string
          minLength: 1
          maxLength: 64
        authority_version:
          type: string
          minLength: 1
          maxLength: 64
        schema_version:
          type: integer
          minimum: 1
          maximum: 1000
        content_sha256:
          type: string
          minLength: 1
          maxLength: 128
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 67108864
    WhiteboardImportValidation:
      type: object
      additionalProperties: false
      required: [valid, manifest, problems]
      properties:
        valid:
          type: boolean
        manifest:
          $ref: "#/components/schemas/WhiteboardImportManifest"
        problems:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum:
              - unsupported_format_version
              - unsupported_engine_version
              - unsupported_authority_version
              - invalid_schema_version
              - invalid_content_sha256
              - invalid_size_bytes
    WhiteboardRestoreRequest:
      type: object
      additionalProperties: false
      required:
        [snapshot_id, expected_version, expected_generation, idempotency_key]
      properties:
        snapshot_id:
          type: string
          format: uuid
        expected_version:
          type: integer
          format: int64
          minimum: 1
        expected_generation:
          type: integer
          format: int64
          minimum: 1
        idempotency_key:
          type: string
          minLength: 16
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$"
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          description: Stable machine-readable failure code such as feature_disabled, quota_exceeded, or feature_control_unavailable.
          maxLength: 64
          pattern: "^[a-z][a-z0-9_]*$"
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
    MediaProviderConvergenceProblem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - business_committed
        - space_id
        - resource_status
        - resource_version
        - provider_effect_status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          const: 503
        code:
          type: string
          const: media_provider_unavailable
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        business_committed:
          type: boolean
          const: true
        space_id:
          type: string
          format: uuid
        resource_status:
          type: string
          const: ended
        resource_version:
          type: integer
          format: int64
          minimum: 1
        provider_effect_status:
          type: string
          enum: [pending, retryable_failed, permanent_failed]
