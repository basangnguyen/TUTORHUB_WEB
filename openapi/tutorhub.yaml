      required:
        [
          can_start,
          can_recover,
          can_end,
          can_cancel,
          can_manage_admissions,
          can_manage_invites,
        ]
      properties:
        can_start:
          type: boolean
        can_recover:
          type: boolean
          description: True only when the latest exact RoomInstance failed and current source authority permits recovery.
        can_end:
          type: boolean
        can_cancel:
          type: boolean
        can_manage_admissions:
          type: boolean
          description: Current server-authorized capability; never inferred from a client or provider role.
        can_manage_invites:
          type: boolean
          description: True only for an authorized StudyMeeting explicit-member manager.
    MediaSpace:
      type: object
      additionalProperties: false
      required:
        - id
