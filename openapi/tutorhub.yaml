openapi: 3.1.0
info:
  title: TutorHub Core API
  version: 0.0.1
  description: |
    Contract for TutorHub V2. Authenticated business operations use the active
    workspace from the server-side session and the shared authorization policy.
    A 403 response means the actor is known but lacks permission. A 404 response
    also covers resources outside the active tenant or class scope so identifiers
    cannot be enumerated across security boundaries.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: getHealth
      summary: Return the Core API health status
      responses:
        "200":
          description: Core API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /live:
    get:
      operationId: getLiveness
      summary: Return process liveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /ready:
    get:
      operationId: getReadiness
      summary: Return service readiness
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/status:
    get:
      operationId: getAPIStatus
      summary: Return versioned Core API status
      responses:
        "200":
          description: Core API is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIStatusResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/home/recent-files:
    get:
      operationId: listHomeRecentFiles
      summary: Return a bounded authorized recent-ready-file projection for Home
      security:
        - SessionCookie: []
      parameters:
        - name: X-TutorHub-Expected-Tenant-ID
          in: header
          required: true
          description: Client cache-scope assertion; authorization still comes only from the server-side active session.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        "200":
          description: Recent ready files visible to the current actor
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeRecentFilePage"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/search:
    get:
      operationId: searchAuthorizedResources
      summary: Search authorized session, conversation and ready-file metadata in PostgreSQL
      description: Returns metadata only. Message bodies, file contents, private descriptions and generated snippets are never searched or projected.
      security:
        - SessionCookie: []
      parameters:
        - name: X-TutorHub-Expected-Tenant-ID
          in: header
          required: true
          description: Client cache-scope assertion; authorization still comes only from the server-side active session.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 12
      responses:
        "200":
          description: Bounded metadata-only search results visible to the current actor
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizedSearchPage"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/auth/login:
    get:
      operationId: beginLogin
      summary: Start an OIDC Authorization Code and PKCE flow
      parameters:
        - name: return_to
          in: query
          required: false
          description: Internal application path used after successful sign-in
          schema:
            type: string
            example: /app/home
      responses:
        "303":
          description: Redirect to the configured identity provider
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/auth/callback:
    get:
      operationId: completeLogin
      summary: Complete the OIDC callback and issue a TutorHub session
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "303":
          description: Session created and browser redirected to TutorHub Web
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/auth/csrf:
    get:
      operationId: rotateCSRFToken
      summary: Rotate and return the CSRF token bound to the current session
      security:
        - SessionCookie: []
      responses:
        "200":
          description: CSRF token rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSRFResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current TutorHub session
      security:
        - SessionCookie: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Local session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Return the authenticated user and tenant context
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Current authenticated principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/me/profile:
    get:
      operationId: getProfile
      summary: Return the authenticated user's editable profile
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Editable user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    patch:
      operationId: updateProfile
      summary: Update editable fields on the authenticated user's profile
      security:
        - SessionCookie: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/me/identities:
    get:
      operationId: listIdentities
      summary: List external identities linked to the authenticated user
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Linked external identities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/me/identities/link:
    post:
      operationId: beginIdentityLink
      summary: Begin a recent-authenticated external identity linking flow
      security:
        - SessionCookie: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Provider authorization URL for the one-time linking flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityLinkResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/me/identities/{identity_id}:
    delete:
      operationId: unlinkIdentity
      summary: Unlink an external identity while preserving at least one login method
      security:
        - SessionCookie: []
      parameters:
        - name: identity_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Identity unlinked
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/tenants:
    get:
      operationId: listTenants
      summary: List workspaces available to the authenticated user
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Membership-scoped workspace list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    post:
      operationId: createTenant
      summary: Create and activate a TutorHub workspace for an eligible user
      security:
        - SessionCookie: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Workspace created and activated for the current session
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/tenants/{tenant_id}:
    get:
      operationId: getTenant
      summary: Return one workspace from the authenticated active scope
      security:
        - SessionCookie: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Active-scope workspace detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    patch:
      operationId: updateTenant
      summary: Update mutable workspace metadata using optimistic concurrency
      security:
        - SessionCookie: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/tenants/{tenant_id}/capabilities:
    get:
      operationId: getTenantCapabilities
      summary: Return server-evaluated feature, quota, and operation capabilities
      description: Any active member of the authenticated active tenant may read this same-tenant snapshot. The response contains effective controls for that tenant; operation availability reflects feature and quota controls only and must be combined with actor/resource permissions. An actor allowed to manage overrides also receives configured edit values, but never another tenant's configuration or deployment guardrail source/ceiling.
      security:
        - SessionCookie: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Effective capability snapshot for the authenticated active tenant
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantCapabilities"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "429":
          $ref: "#/components/responses/ProblemResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/tenants/{tenant_id}/feature-controls:
    put:
      operationId: updateTenantFeatureControls
      summary: Replace tenant feature overrides and quota limits
      description: Only an active organization administrator in the authenticated active tenant may replace these controls. expected_version provides optimistic concurrency; the returned capability snapshot is re-evaluated for the caller.
      security:
        - SessionCookie: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantFeatureControlsRequest"
      responses:
        "200":
          description: Updated controls and re-evaluated capability snapshot
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantCapabilities"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "429":
          $ref: "#/components/responses/ProblemResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: List notifications for the authenticated user in the active tenant
      description: Returns a keyset-paginated, user-scoped feed. System worker canaries are never exposed. Tenant and recipient identifiers come only from the server-side session.
      security:
        - SessionCookie: []
      parameters:
        - name: X-TutorHub-Expected-Tenant-ID
          in: header
          required: true
          description: Client cache-scope assertion; authorization still comes only from the server-side active session.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
        - name: unread_only
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Notification feed for the current active tenant and user
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/notifications/unread-count:
    get:
      operationId: getNotificationUnreadCount
      summary: Return the bounded unread notification count for the current user
      security:
        - SessionCookie: []
      parameters:
        - name: X-TutorHub-Expected-Tenant-ID
          in: header
          required: true
          description: Client cache-scope assertion; authorization still comes only from the server-side active session.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bounded unread count
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationUnreadCount"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/notifications/{notification_id}/read:
    post:
      operationId: markNotificationRead
      summary: Mark one notification read in the current tenant and user scope
      security:
        - SessionCookie: []
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
        - name: X-TutorHub-Expected-Tenant-ID
          in: header
          required: true
          description: Client cache-scope assertion; authorization still comes only from the server-side active session.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated notification
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark every unread notification read in the current tenant and user scope
      security:
        - SessionCookie: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
        - name: X-TutorHub-Expected-Tenant-ID
          in: header
          required: true
          description: Client cache-scope assertion; authorization still comes only from the server-side active session.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Number of rows changed
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAllNotificationsReadResponse"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/classes/{class_id}/files:
    get:
      operationId: listClassFiles
      summary: List authorized file metadata for one class
      description: Returns ready files to current class viewers and additionally returns owned or managed transfer metadata only when authorized. The opaque cursor is bound to the active tenant and class.
      security:
        - SessionCookie: []
      parameters:
        - name: class_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: X-TutorHub-Expected-Tenant-ID
          in: header
          required: true
          description: Client cache-scope assertion; authorization still comes only from the server-side active session.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bounded class-file metadata page
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentFilePage"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/files/upload-intents:
    post:
      operationId: createFileUploadIntent
      summary: Reserve metadata and tenant capacity for one class file upload
      description: Creates an opaque server-owned file identity and short-lived pending reservation. The object key remains private; a separate P3-09 capability endpoint issues a short-lived direct B2 upload URL after reauthorization.
      security:
        - SessionCookie: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
        - name: X-TutorHub-Expected-Tenant-ID
          in: header
          required: true
          description: Client cache-scope assertion; authorization still comes only from the server-side active session.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileUploadIntentRequest"
      responses:
        "200":
          description: Existing pending or uploaded file returned by an exact idempotent replay
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentFile"
        "201":
          description: Pending file metadata and quota reservation created
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
