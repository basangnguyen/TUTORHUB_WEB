          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Inclusive local civil start in HH:mm form.
        ends_at:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Exclusive local civil end in HH:mm form; it must be after starts_at on the same day.
    CalendarClosedWorkingScheduleException:
      type: object
      additionalProperties: false
      required: [date, kind, intervals]
      properties:
        date:
          type: string
          format: date
        kind:
          type: string
          enum: [holiday, out_of_office]
        intervals:
          type: array
          maxItems: 0
          items:
            $ref: "#/components/schemas/CalendarCivilTimeInterval"
          description: Closed-day exceptions must contain an empty interval array.
    CalendarSpecialHoursWorkingScheduleException:
      type: object
