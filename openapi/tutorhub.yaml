components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: tutorhub_session
      description: Opaque TutorHub BFF session cookie; secure deployments use the __Host- prefix.
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit CSRF token bound to the active authenticated session.
      schema:
        type: string
        minLength: 16
        maxLength: 512
    ExpectedTenantID:
      name: X-TutorHub-Expected-Tenant-ID
      in: header
      required: true
      description: Active workspace assertion used to prevent confused-deputy mutations and reads.
      schema:
        type: string
        format: uuid
    WhiteboardDocumentID:
      name: document_id
      in: path
      required: true
      description: Opaque canonical control-plane document identifier; never a provider document name.
      schema:
        type: string
        format: uuid
    MediaParticipantKeyPath:
      name: participant_key
      in: path
      required: true
      description: Opaque RoomInstance-scoped participant key; never a user, session, or provider identity.
      schema:
        type: string
        format: uuid
    PollID:
      name: poll_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    AvailabilityPollResponse:
      description: Authorization-filtered availability poll projection
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AvailabilityPoll"
    WhiteboardDocumentResponse:
      description: Authorization-filtered whiteboard control-plane projection
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WhiteboardDocument"
    WhiteboardArtifactCommandResponse:
      description: Whiteboard snapshot or export command accepted for asynchronous processing
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WhiteboardArtifactCommand"
    ProblemResponse:
      description: Request failed with a structured problem response
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnauthorizedResponse:
      description: Authentication is missing, expired, or invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ForbiddenResponse:
      description: The authenticated actor lacks permission in the active workspace
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFoundResponse:
      description: The resource is absent or outside the active tenant/class scope
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConflictResponse:
      description: The request conflicts with the current resource state or version
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    OrganizationRole:
      type: string
      enum: [org_admin, teacher, student, guest]
    ClassRole:
      type: string
      enum: [owner, co_teacher, teaching_assistant, student]
    ClassEnrollmentRole:
      type: string
      description: Persisted enrollment roles; class owner remains implicit in classes.owner_user_id.
      enum: [co_teacher, teaching_assistant, student]
    Permission:
      type: string
      enum:
        - tenant.view
        - tenant.manage
        - tenant.manage_members
        - tenant.manage_features
        - class.create
        - class.update
        - class.archive
        - class.transfer_ownership
        - class.view
        - conversation.create_direct
        - message.write_direct
        - enrollment.manage
        - enrollment.leave
        - session.schedule
        - session.start
        - session.end
        - session.join
        - availability.poll.create
        - availability.poll.manage_own
        - availability.poll.publish_to_class
        - study_meeting.schedule_own
        - participant.admit
        - participant.remove
        - media.publish
        - chat.send
        - audit.view
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, environment, timestamp]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
        environment:
          type: string
        timestamp:
          type: string
          format: date-time
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status, timestamp]
      properties:
        status:
          type: string
          const: live
        timestamp:
          type: string
          format: date-time
    ReadinessCheck:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ready, not_ready]
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, checks, timestamp]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessCheck"
        timestamp:
          type: string
          format: date-time
    APIStatusResponse:
      type: object
      additionalProperties: false
      required: [status, service, version, environment, timestamp]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
        version:
          type: string
        environment:
          type: string
        timestamp:
          type: string
          format: date-time
    HomeRecentFile:
      type: object
      additionalProperties: false
      required:
        - id
        - class_id
        - class_title
        - display_name
        - declared_media_type
        - size_bytes
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        class_title:
          type: string
        display_name:
          type: string
        declared_media_type:
